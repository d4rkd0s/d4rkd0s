    <script>
    (function () {
        var canvas = document.getElementById('matrix-canvas');
        var ctx = canvas.getContext('2d');

        var CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
                    'ァィゥェォッャュョ0123456789!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';

        var fontSize = 14;
        var columns = 0;
        var drops = [];

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (var i = 0; i < columns; i++) {
                drops[i] = Math.random() * -canvas.height / fontSize;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // Per-column speed (1–3 px/frame expressed as fraction of a cell)
        var speeds = [];
        var fractional = [];
        for (var i = 0; i < 2000; i++) {
            speeds[i]     = 1 + Math.random() * 2;   // 1–3
            fractional[i] = 0;
        }

        // Gray shades for trail — from light (#ccc) to dark (#444)
        // We'll pick shade based on distance behind the head
        var trailLength = 20; // cells before fully dark

        function shade(distFromHead) {
            // distFromHead 0 = just behind head (lightest), trailLength = darkest
            var t = Math.min(distFromHead / trailLength, 1);
            // Interpolate lightness: 204 (#cc) → 68 (#44)
            var v = Math.round(204 - t * (204 - 68));
            // Opacity also fades
            var alpha = 1 - t * 0.6;
            return 'rgba(' + v + ',' + v + ',' + v + ',' + alpha + ')';
        }

        function draw() {
            // Fade the whole canvas with a translucent black overlay — creates the trail
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (var i = 0; i < columns; i++) {
                // Advance fractional position
                fractional[i] = (fractional[i] || 0) + speeds[i];
                var steps = Math.floor(fractional[i] / fontSize);
                if (steps > 0) {
                    drops[i]      += steps;
                    fractional[i] -= steps * fontSize;
                }

                var headY = Math.floor(drops[i]);

                // Draw leading character — bright white
                if (headY >= 0 && headY * fontSize < canvas.height) {
                    var ch = CHARS[Math.floor(Math.random() * CHARS.length)];
                    ctx.fillStyle = 'rgba(255,255,255,1)';
                    ctx.fillText(ch, i * fontSize, headY * fontSize);
                }

                // Reset when column has scrolled fully off screen
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = Math.floor(Math.random() * -20);
                }
            }

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    })();
    </script>
