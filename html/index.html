    <script>
    /* ── Donate popup JS ── */
    var CHAINS = {
        eth: { label: 'ETH / Ethereum',  addr: '0xe075d7A651035FA26b9f7E93EBc57F0C03b25D1F', uri: 'ethereum:0xe075d7A651035FA26b9f7E93EBc57F0C03b25D1F', send: 'sendEth' },
        btc: { label: 'BTC / Bitcoin',   addr: 'bc1qra7ga4nr056qr4kgef5ckkd4hccghnzkgqa9fn', uri: 'bitcoin:bc1qra7ga4nr056qr4kgef5ckkd4hccghnzkgqa9fn', send: null },
        sol: { label: 'SOL / Solana',    addr: '43TL918ckXnUYhsHc1pwBLt6bLRaTBjsdCtWx1JkwzCV', uri: 'solana:43TL918ckXnUYhsHc1pwBLt6bLRaTBjsdCtWx1JkwzCV', send: 'sendSol' }
    };
    var activeChain = null;
    var qrDone = {};

    function openPopup(chain) {
        if (activeChain === chain && document.getElementById('donate-popup').classList.contains('open')) {
            closePopup(); return;
        }
        activeChain = chain;
        var c = CHAINS[chain];
        document.getElementById('popup-chain').textContent = c.label;
        document.getElementById('popup-addr').textContent = c.addr;
        document.getElementById('popup-status').textContent = '';
        document.getElementById('popup-status').className = 'popup-status';

        var actions = document.getElementById('popup-actions');
        actions.innerHTML = '';

        // Copy button
        var copyBtn = document.createElement('button');
        copyBtn.className = 'popup-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.onclick = function() {
            navigator.clipboard.writeText(c.addr).then(function() {
                copyBtn.textContent = 'Copied!';
                setTimeout(function() { copyBtn.textContent = 'Copy'; }, 2000);
            });
        };
        actions.appendChild(copyBtn);

        // QR button
        var qrBtn = document.createElement('button');
        qrBtn.className = 'popup-btn';
        qrBtn.textContent = 'QR';
        var qrBox = document.createElement('div');
        qrBox.style.cssText = 'display:none;margin-top:10px;background:#fff;padding:6px;border-radius:4px;line-height:0;';
        document.getElementById('popup-actions').after(qrBox);
        qrBtn.onclick = function() {
            if (qrBox.style.display === 'none') {
                if (!qrDone[chain]) {
                    new QRCode(qrBox, { text: c.uri, width: 150, height: 150, colorDark: '#000', colorLight: '#fff' });
                    qrDone[chain] = true;
                }
                qrBox.style.display = 'inline-block';
                qrBtn.textContent = 'Hide QR';
            } else {
                qrBox.style.display = 'none';
                qrBtn.textContent = 'QR';
            }
        };
        actions.appendChild(qrBtn);

        // Send button (ETH/SOL only)
        if (c.send) {
            var sendBtn = document.createElement('button');
            sendBtn.className = 'popup-btn';
            sendBtn.textContent = 'Send';
            sendBtn.onclick = window[c.send];
            actions.appendChild(sendBtn);
        }

        document.getElementById('donate-popup').classList.add('open');
    }

    function closePopup() {
        document.getElementById('donate-popup').classList.remove('open');
        activeChain = null;
    }

    document.addEventListener('click', function(e) {
        var popup = document.getElementById('donate-popup');
        if (!popup.contains(e.target) && !e.target.classList.contains('coin-btn')) closePopup();
    });

    function setPopupStatus(msg, type) {
        var el = document.getElementById('popup-status');
        el.textContent = msg;
        el.className = 'popup-status' + (type ? ' ' + type : '');
        if (msg) setTimeout(function() { el.textContent = ''; el.className = 'popup-status'; }, 5000);
    }

    async function sendEth() {
        if (!window.ethereum) { alert('Install MetaMask to send ETH.'); return; }
        try {
            var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            var amountStr = prompt('Amount in ETH:');
            if (!amountStr) return;
            var amount = parseFloat(amountStr);
            if (isNaN(amount) || amount <= 0) { setPopupStatus('Invalid amount.', 'err'); return; }
            setPopupStatus('Waiting for wallet...', '');
            var tx = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: accounts[0], to: CHAINS.eth.addr, value: ethers.toBeHex(ethers.parseEther(amountStr.trim())) }] });
            setPopupStatus('Sent! ' + tx.slice(0,10) + '…', 'ok');
        } catch(e) { setPopupStatus(e.message || 'Error', 'err'); }
    }

    async function sendSol() {
        if (!window.solana?.isPhantom) { alert('Install Phantom to send SOL.'); return; }
        try {
            await window.solana.connect();
            var amountStr = prompt('Amount in SOL:');
            if (!amountStr) return;
            var amount = parseFloat(amountStr);
            if (isNaN(amount) || amount <= 0) { setPopupStatus('Invalid amount.', 'err'); return; }
            setPopupStatus('Building transaction...', '');
            var conn = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'));
            var tx = new solanaWeb3.Transaction().add(solanaWeb3.SystemProgram.transfer({ fromPubkey: new solanaWeb3.PublicKey(window.solana.publicKey.toString()), toPubkey: new solanaWeb3.PublicKey(CHAINS.sol.addr), lamports: Math.round(amount * 1e9) }));
            var { blockhash } = await conn.getLatestBlockhash();
            tx.recentBlockhash = blockhash;
            tx.feePayer = window.solana.publicKey;
            var sig = await window.solana.signAndSendTransaction(tx);
            setPopupStatus('Sent! ' + sig.signature.slice(0,10) + '…', 'ok');
        } catch(e) { setPopupStatus(e.message || 'Error', 'err'); }
    }
    </script>

    <script>
    (function () {
        var canvas = document.getElementById('matrix-canvas');
        var ctx = canvas.getContext('2d');

        var CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
                    'ァィゥェォッャュョ0123456789!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';

        var fontSize = 14;
        var columns = 0;
        var drops = [];

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (var i = 0; i < columns; i++) {
                drops[i] = Math.random() * -canvas.height / fontSize;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // Per-column speed (1–3 px/frame expressed as fraction of a cell)
        var speeds = [];
        var fractional = [];
        for (var i = 0; i < 2000; i++) {
            speeds[i]     = 1 + Math.random() * 2;   // 1–3
            fractional[i] = 0;
        }

        // Gray shades for trail — from light (#ccc) to dark (#444)
        // We'll pick shade based on distance behind the head
        var trailLength = 20; // cells before fully dark

        function shade(distFromHead) {
            // distFromHead 0 = just behind head (lightest), trailLength = darkest
            var t = Math.min(distFromHead / trailLength, 1);
            // Interpolate lightness: 204 (#cc) → 68 (#44)
            var v = Math.round(204 - t * (204 - 68));
            // Opacity also fades
            var alpha = 1 - t * 0.6;
            return 'rgba(' + v + ',' + v + ',' + v + ',' + alpha + ')';
        }

        function draw() {
            // Fade the whole canvas with a translucent black overlay — creates the trail
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (var i = 0; i < columns; i++) {
                // Advance fractional position
                fractional[i] = (fractional[i] || 0) + speeds[i];
                var steps = Math.floor(fractional[i] / fontSize);
                if (steps > 0) {
                    drops[i]      += steps;
                    fractional[i] -= steps * fontSize;
                }

                var headY = Math.floor(drops[i]);

                // Draw leading character — bright white
                if (headY >= 0 && headY * fontSize < canvas.height) {
                    var ch = CHARS[Math.floor(Math.random() * CHARS.length)];
                    ctx.fillStyle = 'rgba(255,255,255,1)';
                    ctx.fillText(ch, i * fontSize, headY * fontSize);
                }

                // Reset when column has scrolled fully off screen
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = Math.floor(Math.random() * -20);
                }
            }

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    })();
    </script>
